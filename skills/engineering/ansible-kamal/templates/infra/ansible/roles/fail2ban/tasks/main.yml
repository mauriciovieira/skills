---
- name: Create fail2ban jail config for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = %(sshd_log)s
      bantime = 1h
      findtime = 10m
      maxretry = 5
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is started and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
