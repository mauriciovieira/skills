---
- name: Ensure /opt exists with correct permissions
  ansible.builtin.file:
    path: /opt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Traefik directory structure with deploy ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ traefik_data_dir }}"
    - "{{ traefik_acme_dir }}"
    - "{{ traefik_config_dir }}"
