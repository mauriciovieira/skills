[defaults]
roles_path = roles
# Host key checking stays enabled (Ansible default). First connect is handled
# by StrictHostKeyChecking=accept-new in the inventory ansible_ssh_common_args,
# which
# pins the host key after the first connection instead of skipping verification
# entirely. Disabling it here (host_key_checking = False) would silently negate
# that pinning and reopen the MITM window.
retry_files_enabled = False
# UFW enable can stall the control connection briefly; avoid false timeouts mid-playbook.
timeout = 90
